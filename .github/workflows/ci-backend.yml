name: CI Backend API - DevGroup Concours

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: "/home/devgroup-africa/projects/projets-internes/devgroup-concours/api"
  IMAGE_NAME: "devgroup-concours-api"
  API_PORT: "3000"
  MONGODB_PORT: "27017"

jobs:
  validate:
    name: Lint et Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Récupérer le repository
        uses: actions/checkout@v7

      - name: 📦 Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📊 Afficher les versions
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "📍 Chemin: ${{ env.PROJECT_PATH }}"

      - name: 📦 Installer les dépendances
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: ✅ Tests
        run: npm test
        continue-on-error: true

      - name: 📝 Typecheck
        run: npm run typecheck
        continue-on-error: true

  container:
    name: Build et test Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐳 Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: devgroup-concours-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Démarrer container
        run: |
          docker run --detach --rm --name api-ci \
            --publish 3000:3000 \
            --env NODE_ENV=production \
            --env MONGODB_URI=mongodb://localhost:27017/devgroup-concours \
            devgroup-concours-api:ci

      - name: 🧪 Test
        run: |
          set -euo pipefail
          echo "🔄 Test API..."
          for attempt in {1..30}; do
            if curl -f http://127.0.0.1:3000/health > /dev/null 2>&1 || curl -s http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "✅ API OK"
              exit 0
            fi
            sleep 2
          done
          docker logs api-ci
          exit 1

      - name: 📋 Logs
        if: failure()
        run: docker logs api-ci || true

      - name: 🛑 Stop
        if: always()
        run: docker stop api-ci || true

      - name: 📌 Info
        if: success()
        run: |
          echo "✨ API compilée"
          echo "📁 Chemin: ${{ env.PROJECT_PATH }}"
          echo "🌐 Port: 3000"