name: CI Backend API - DevGroup Concours

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: "/home/devgroup-africa/projects/projets-internes/devgroup-concours/api"
  IMAGE_NAME: "devgroup-concours-api"
  API_PORT: "3000"

jobs:
  validate:
    name: Lint et Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📊 Display versions
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "📍 Project Path: ${{ env.PROJECT_PATH }}"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: ✅ Tests
        run: npm test
        continue-on-error: true

      - name: 📝 Typecheck
        run: npm run typecheck
        continue-on-error: true

  container:
    name: Build and test container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - validate

    services:
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔨 Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Start production container
        run: |
          docker run \
            --detach \
            --rm \
            --name ${{ env.IMAGE_NAME }}-ci \
            --publish ${{ env.API_PORT }}:3000 \
            --env NODE_ENV=production \
            --env MONGODB_URI=mongodb://localhost:27017/devgroup-concours \
            ${{ env.IMAGE_NAME }}:ci

      - name: 🧪 Smoke test production container
        run: |
          set -euo pipefail

          echo "🔄 Testing API on port ${{ env.API_PORT }}..."
          echo "📍 Project Path: ${{ env.PROJECT_PATH }}"

          for attempt in {1..30}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://127.0.0.1:${{ env.API_PORT }}/health \
              > /dev/null 2>&1 || \
              curl \
              --silent \
              http://127.0.0.1:${{ env.API_PORT }}/ \
              > /dev/null 2>&1; then

              echo "✅ DevGroup Concours API is responding on port ${{ env.API_PORT }}"
              exit 0
            fi

            echo "⏳ Waiting for API... attempt ${attempt}/30"
            sleep 2
          done

          echo "❌ API did not start correctly."
          docker logs ${{ env.IMAGE_NAME }}-ci
          exit 1

      - name: 📋 Show container logs
        if: failure()
        run: docker logs ${{ env.IMAGE_NAME }}-ci || true

      - name: ���� Stop production container
        if: always()
        run: docker stop ${{ env.IMAGE_NAME }}-ci || true

      - name: 📌 Deployment info
        if: success()
        run: |
          echo "✨ API successfully built and tested"
          echo "📁 Project Path: ${{ env.PROJECT_PATH }}"
          echo "🔧 Docker Image: ${{ env.IMAGE_NAME }}:ci"
          echo "🌐 API Port: ${{ env.API_PORT }}"
